<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>إكزاميفاي AI - نظام تشغيل تعليمي</title>
    <meta name="description" content="إكزاميفاي AI منصة تعليمية وإدارية لإدارة التقييمات والاختبارات والتصحيح الإلكتروني والتحليلات الأكاديمية المدعومة بالذكاء الاصطناعي." />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="إكزاميفاي" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Splash Screen -->
    <meta name="apple-touch-fullscreen" content="yes" />

    <!-- Windows Tile -->
    <meta name="msapplication-TileColor" content="#0f766e" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Disable automatic phone number detection -->
    <meta name="format-detection" content="telephone=no" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        const isLocalDev = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
        if (isLocalDev) {
          navigator.serviceWorker.getRegistrations()
            .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
            .catch((error) => console.log('SW unregister failed:', error));
          if ('caches' in window) {
            caches.keys()
              .then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
              .catch((error) => console.log('Cache clear failed:', error));
          }
        }

        window.addEventListener('load', () => {
          if (isLocalDev) {
            navigator.serviceWorker.getRegistrations()
              .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
              .catch((error) => console.log('SW unregister failed:', error));
            return;
          }

          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
