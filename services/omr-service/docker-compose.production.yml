services:
  omr-service:
    build: .
    environment:
      OMR_SERVICE_TOKEN: ${OMR_SERVICE_TOKEN:?Set a strong OMR_SERVICE_TOKEN}
      OMR_MAX_REQUEST_BYTES: ${OMR_MAX_REQUEST_BYTES:-26214400}
      OMR_MAX_PAGES: ${OMR_MAX_PAGES:-20}
      OMR_PDF_DPI: ${OMR_PDF_DPI:-300}
    expose:
      - "8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

  omr-worker:
    build: .
    command: ["python", "-m", "app.worker"]
    depends_on:
      omr-service:
        condition: service_healthy
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set the production Supabase URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set the production Supabase service role key}
      OMR_SERVICE_URL: http://omr-service:8080
      OMR_SERVICE_TOKEN: ${OMR_SERVICE_TOKEN:?Set a strong OMR_SERVICE_TOKEN}
      OMR_WORKER_ID: ${OMR_WORKER_ID:-omr-worker-1}
      OMR_WORKER_CONCURRENCY: ${OMR_WORKER_CONCURRENCY:-2}
      OMR_WORKER_POLL_SECONDS: ${OMR_WORKER_POLL_SECONDS:-2}
      OMR_WORKER_TIMEOUT_SECONDS: ${OMR_WORKER_TIMEOUT_SECONDS:-120}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
